name: Build offline data and Android app

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "data/**"
      - "vendor/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: haram-guide-build
  cancel-in-progress: false

jobs:
  data:
    name: Offline data (Quran, fonts, map)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build offline data
        run: |
          mkdir -p .build
          echo '{"name":"hg-build","version":"1.0.0","private":true}' > .build/package.json
          npm install --prefix .build --no-audit --no-fund quran-cloud@1.0.0 leaflet@1.9.4 three@0.149.0 @fontsource/anek-bangla@5.3.0 @fontsource/noto-serif-bengali@5.3.0 @fontsource/amiri-quran@5.3.0
          node build-data.mjs

      - name: Save offline data in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data vendor
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Update offline data"
            git push
            # refresh the website (GitHub Pages) so it gets the new files
            curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi

  apk:
    name: Android app
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare app files
        run: |
          # app icons: made here if they are not in the repository
          [ -f icon-192.png ] || echo "" | base64 -d > icon-192.png
          [ -f icon-512.png ] || echo "" | base64 -d > icon-512.png
          [ -f manifest.webmanifest ] || echo '{"name":"Haram Guide","short_name":"Haram Guide","start_url":"./#home","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png"},{"src":"icon-512.png","sizes":"512x512","type":"image/png"}]}' > manifest.webmanifest
          mkdir -p app/www
          # copy every app file in the repository root, so a new file is never left out of the app
          for f in *.html *.js *.webmanifest *.png *.svg; do
            [ -f "$f" ] && cp "$f" app/www/
          done
          for f in index.html haram3d.js guide3d.js tawaf.js umrah.js hajj.js madinah.js madinah-places.js cloud.js firebase-config.js; do
            [ -f "$f" ] || { echo "::error::Missing file in the repository: $f (upload it to the main folder)"; exit 1; }
          done
          ls app/www
          [ -f index.html ] || { echo "index.html is missing from the repository"; exit 1; }
          cp -r data vendor app/www/
          cd app
          echo '{"name":"haram-guide","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.haramguide.app","appName":"Haram Guide","webDir":"www","plugins":{"LocalNotifications":{"smallIcon":"ic_stat_haram","iconColor":"#0B6B50"}}}' > capacitor.config.json
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          # small bridge so the web page can use the phone's notifications
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap add android

      - name: Location permission and icon
        run: |
          cd app
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$M"
          grep -q ACCESS_FINE_LOCATION "$M" && echo "Location permission added"
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp ../icon-512.png "$d/ic_launcher.png"
            cp ../icon-512.png "$d/ic_launcher_round.png"
            cp ../icon-512.png "$d/ic_launcher_foreground.png"
          done
          # the app's own notification icon: a white Kaaba shape (Android shows it in the status bar and on each alert)
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_haram.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:fillType="evenOdd" android:pathData="M4,7 L12,3 L20,7 L20,17 L12,21 L4,17 Z M4,7.2 L12,11.2 L20,7.2 L20,8.3 L12,12.3 L4,8.3 Z M4,10 L12,14 L20,10 L20,11.7 L12,15.7 L4,11.7 Z" />
          </vector>
          XML
          echo "Notification icon added"

      - name: Build APK
        run: |
          # the GitHub machine already has the Android SDK installed
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > app/android/local.properties
          cd app
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../HaramGuide.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HaramGuide-apk
          path: HaramGuide.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Haram Guide ${{ github.run_number }}
          files: HaramGuide.apk
